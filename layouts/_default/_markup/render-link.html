{{- $baseURL := site.BaseURL -}}{{/* 使用 site 函数获取全局配置 */}}
{{- $baseHost := (urls.Parse $baseURL).Host -}}
{{- $destHost := (urls.Parse .Destination).Host -}}

<a href="{{ .Destination | safeURL }}" {{- with .Title }} title="{{ . }}" {{ end -}} {{- if not (or (eq $destHost "" )
  (eq $destHost $baseHost)) }} target="_blank" rel="noopener noreferrer" {{- end -}}>

  <span>{{- with .Text | safeHTML }}{{ . }}</span>
  {{- if not (or (eq $destHost "" )
  (eq $destHost $baseHost)) }}
  <svg fill="none" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round"
    stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" height="12" width="12">
    <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path>
    <path d="M15 3h6v6"></path>
    <path d="M10 14L21 3"></path>
  </svg>
  {{- end }}
  {{ end -}}
</a>
